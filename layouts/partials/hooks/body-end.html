{{ if or (eq .Section "docs") (eq .Section "blog") }}
<div id="rs-progress" style="
  position:fixed;top:0;left:0;height:2px;
  width:0%;background:#B8945A;
  z-index:9999;transition:width 0.1s linear;
  pointer-events:none;"></div>
<script>
(function(){
  var bar = document.getElementById('rs-progress');
  if (!bar) return;
  window.addEventListener('scroll', function(){
    var s = document.documentElement;
    var pct = s.scrollTop / (s.scrollHeight - s.clientHeight) * 100;
    bar.style.width = Math.min(pct, 100) + '%';
  }, { passive: true });
})();
</script>
{{ end }}

{{/* Mermaid diagrams: load only on pages that contain a ```mermaid block */}}
{{ if findRE "```mermaid" .RawContent 1 }}
<script type="module">
// Load Mermaid (large) only when a diagram comes near the viewport.
const blocks = [...document.querySelectorAll('pre.mermaid, div.mermaid')];
let mermaidReady = null;
let seq = 0;
const getMermaid = () => mermaidReady ??= import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs').then(({ default: mermaid }) => {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif',
      fontSize: '14px',
      primaryColor: '#fdf9f4',
      primaryBorderColor: '#B8945A',
      primaryTextColor: '#1c1d1f',
      lineColor: '#9a7340',
      secondaryColor: '#f5ede0',
      tertiaryColor: '#ffffff'
    }
  });
  return mermaid;
});
// Render one by one with our own ids: mermaid's default ids are time-based and can collide.
let queue = Promise.resolve();
const render = (el) => {
  if (el.dataset.processed) return;
  el.dataset.processed = 'true';
  queue = queue.then(async () => {
    const mermaid = await getMermaid();
    try {
      const { svg } = await mermaid.render('rs-mermaid-' + (seq++), el.textContent);
      el.innerHTML = svg;
    } catch (e) {
      console.error('Mermaid render failed', e);
    }
  });
};
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { io.unobserve(en.target); render(en.target); } });
  }, { rootMargin: '600px 0px' });
  blocks.forEach((b) => io.observe(b));
} else {
  blocks.forEach(render);
}
</script>
{{ end }}

{{ if hugo.IsProduction }}
<script>
(function() {
  const gaId = 'G-P2ERDP8TT3';
  let initialized = false;

  function loadGA() {
    if (initialized) return;
    initialized = true;

    // Clean up event listeners immediately so they only fire once
    window.removeEventListener('scroll', loadGA);
    window.removeEventListener('mousemove', loadGA);
    window.removeEventListener('touchstart', loadGA);

    // Dynamically inject the Google Tag Manager script
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
    document.head.appendChild(script);

    // Initialize GA4 tracking
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', gaId, { 'anonymize_ip': true });
  }

  // Listen for user interactions to load GA
  window.addEventListener('scroll', loadGA, { passive: true });
  window.addEventListener('mousemove', loadGA, { passive: true });
  window.addEventListener('touchstart', loadGA, { passive: true });

  // Fallback: Force load after 4 seconds if the user stays completely idle
  setTimeout(loadGA, 4000);
})();
</script>
{{ end }}
